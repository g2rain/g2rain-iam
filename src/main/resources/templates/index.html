<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${brandName}">欢迎</title>
    <style th:replace="~{fragments/styles-common :: common}"></style>
    <style th:inline="text">
        .account-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .account-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }
        .account-row:last-of-type {
            border-bottom: none;
        }
        .account-label {
            color: #94a3b8;
            font-size: 14px;
            flex-shrink: 0;
        }
        .account-value {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }
        .account-welcome {
            margin-bottom: 8px;
        }
        .account-header-name {
            color: #e2e8f0;
            font-weight: 500;
        }
    </style>
</head>
<body class="landing-body">
<main class="landing-shell">
    <header class="landing-header">
        <a th:href="@{/auth/index.html}" class="landing-brand">
            <span class="landing-brand-mark">⚡</span>
            <span th:text="${brandName}">G2Rain IAM</span>
        </a>
        <div class="landing-header-links">
            <span class="link-muted account-header-name" th:text="${accountName}">已登录用户</span>
        </div>
    </header>

    <section class="landing-grid">
        <div class="landing-panel feature-panel">
            <h1 class="title" th:text="${brandName}">G2Rain IAM</h1>
            <p class="desc account-welcome">
                欢迎回来，<span th:text="${accountName}">用户</span>。
                您已通过统一身份认证登录，可在下方查看当前账号信息。
            </p>
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">安全认证</div>
                    <div class="feature-desc">支持标准认证流程，保障登录链路与账号安全。</div>
                </div>
                <div class="feature-card">
                    <div class="feature-title">高性能稳定</div>
                    <div class="feature-desc">响应快速、服务稳定，适配高并发访问场景。</div>
                </div>
                <div class="feature-card">
                    <div class="feature-title">易于集成</div>
                    <div class="feature-desc">界面简洁、接入路径清晰，降低系统对接复杂度。</div>
                </div>
            </div>
        </div>

        <div class="landing-panel action-panel landing-op-links">
            <h2 class="title">当前账号</h2>
            <p class="desc">以下为您当前登录的通行证信息。</p>
            <div class="account-card">
                <div class="account-row">
                    <span class="account-label">显示名称</span>
                    <span class="account-value" th:text="${accountName}">-</span>
                </div>
                <div class="account-row">
                    <span class="account-label">通行证 ID</span>
                    <span class="account-value" th:text="${passportId}">-</span>
                </div>
                <div class="account-row">
                    <span class="account-label">登录方式</span>
                    <span class="account-value" th:text="${loginMethod}">-</span>
                </div>
                <div class="account-row" th:if="${idpBindModeLabel != null and !#strings.isEmpty(idpBindModeLabel)}">
                    <span class="account-label">接入形态</span>
                    <span class="account-value" th:text="${idpBindModeLabel}">-</span>
                </div>
            </div>
            <div class="action-links">
                <a th:href="@{/auth/logout}" class="btn btn-outline btn-lg">退出当前登录</a>
            </div>
        </div>
    </section>

    <footer class="landing-footer" th:text="${brandName}">
        G2Rain IAM
    </footer>
</main>
</body>
</html>
