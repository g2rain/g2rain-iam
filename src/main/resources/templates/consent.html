<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权确认</title>
    <style th:replace="~{fragments/styles-common :: common}"></style>
</head>
<body class="landing-body">
<main class="landing-shell">
    <header class="landing-header">
        <a th:href="@{/auth/index.html}" class="landing-brand">
            <span class="landing-brand-mark">⚡</span>
            <span th:text="${brandName}">G2Rain IAM</span>
        </a>
        <div class="landing-header-links">
            <a th:href="@{/auth/authorize}" class="link-muted">立即登录</a>
        </div>
    </header>

    <section class="landing-grid">
        <div class="landing-panel feature-panel">
            <h2 class="title" th:text="${applicationCode != null and !#strings.isEmpty(applicationCode)} ? '应用授权确认' : '选择用户'">授权确认</h2>
            <p class="desc"
               th:text="${applicationCode != null and !#strings.isEmpty(applicationCode)}
                 ? '请确认是否授权目标应用；确认后将自动开通该应用的自助能力。'
                 : '请选择用于授权的用户，选择后将返回应用。'">请选择用户。</p>
            <div class="feature-list" th:if="${preview != null}">
                <div class="feature-card">
                    <div class="feature-title">应用</div>
                    <div class="feature-desc" th:text="${preview.applicationName}">应用名称</div>
                </div>
                <div class="feature-card" th:if="${preview.description != null and !#strings.isEmpty(preview.description)}">
                    <div class="feature-title">说明</div>
                    <div class="feature-desc" th:text="${preview.description}">应用描述</div>
                </div>
                <div class="feature-card" th:if="${preview.organName != null and !#strings.isEmpty(preview.organName)}">
                    <div class="feature-title">租户</div>
                    <div class="feature-desc" th:text="${preview.organName}">租户名称</div>
                </div>
            </div>
        </div>

        <div class="landing-panel action-panel landing-op-table">
            <h2 class="title"
                th:text="${applicationCode != null and !#strings.isEmpty(applicationCode) and selectedUserId != null and selectedUserId != ''}
                  ? '确认授权' : '选择用户'">选择用户</h2>

            <div th:if="${previewError != null}" class="error-message" th:text="${previewError}">预览失败</div>

            <!-- 尚未选定用户：选用户（无 applicationCode 选后直接发码；有则进入确认） -->
            <div th:if="${selectedUserId == null or selectedUserId == ''}">
                <p class="desc">请选择用于授权的用户。</p>
                <form id="selectUserForm" method="get" action="/auth/authorize">
                    <input type="hidden" name="userId" id="selectUserId">
                    <input type="hidden" name="tid" th:value="${tid} ?: ''">
                </form>
                <div class="table-container">
                    <table>
                        <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>用户名</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${users == null or users.isEmpty()}">
                            <td colspan="2" class="empty-message">暂无用户数据</td>
                        </tr>
                        <tr th:each="user : ${users}" th:attr="onclick=|selectUser('${user.id}')|">
                            <td th:text="${user.id}">用户ID</td>
                            <td th:text="${user.username}">用户名</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 有 applicationCode 且已选定用户：确认 / 拒绝 -->
            <div th:if="${applicationCode != null and !#strings.isEmpty(applicationCode) and selectedUserId != null and selectedUserId != ''}">
                <p class="desc" th:if="${users != null and users.size() > 1}">
                    当前用户：<span th:text="${selectedUserId}"></span>
                </p>
                <form id="authorizeForm" method="post" action="/auth/authorize_selected">
                    <input type="hidden" name="userId" th:value="${selectedUserId}">
                    <input type="hidden" name="tid" th:value="${tid} ?: ''">
                    <input type="hidden" name="denied" id="denied" value="false">

                    <div class="form-actions landing-form-actions">
                        <button type="submit" class="btn btn-primary btn-lg"
                                th:disabled="${preview == null}">
                            确认授权
                        </button>
                        <button type="button" class="btn btn-outline btn-lg" onclick="denyConsent()">拒绝</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="landing-footer" th:text="${brandName}">
        G2Rain IAM
    </footer>
</main>

<script>
    function selectUser(userId) {
        document.getElementById('selectUserId').value = userId;
        document.getElementById('selectUserForm').submit();
    }
    function denyConsent() {
        document.getElementById('denied').value = 'true';
        document.getElementById('authorizeForm').submit();
    }
</script>
</body>
</html>
