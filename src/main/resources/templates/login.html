<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style th:replace="~{fragments/styles-common :: common}"></style>
    <style th:replace="~{fragments/styles-login-page :: loginPage}"></style>
</head>
<body class="landing-body login-page">
<main class="landing-shell">
    <header class="landing-header">
        <a th:href="@{/auth/index.html}" class="landing-brand">
            <span class="landing-brand-mark">⚡</span>
            <span th:text="${brandName}">G2Rain IAM</span>
        </a>
        <div class="landing-header-links">
            <a th:href="@{/auth/index.html}" class="link-muted">返回首页</a>
        </div>
    </header>

    <section class="landing-grid">
        <div class="landing-panel feature-panel">
            <h2 class="title">IAM 平台介绍</h2>
            <p class="desc">面向企业场景的统一身份认证入口，支持安全、稳定、可扩展的认证接入。</p>
            <div class="feature-list">
                <div class="feature-card">
                    <div class="feature-title">安全可靠</div>
                    <div class="feature-desc">保障登录链路安全，降低账号被滥用风险。</div>
                </div>
                <div class="feature-card">
                    <div class="feature-title">高效接入</div>
                    <div class="feature-desc">标准流程易对接，让业务系统更快落地。</div>
                </div>
                <div class="feature-card">
                    <div class="feature-title">可扩展</div>
                    <div class="feature-desc">预留扩展能力，便于后续策略与能力升级。</div>
                </div>
            </div>
        </div>

        <div class="landing-panel action-panel landing-op-form landing-op-login"
             th:with="hasTid=${tid != null and !#strings.isEmpty(tid)},
                      passwordEnabled=${hasTid and hasPassword == true},
                      hasDingTalk=${hasTid and dingTalkBindMode != null and !#strings.isEmpty(dingTalkBindMode)},
                      hasWeCom=${hasTid and weComBindMode != null and !#strings.isEmpty(weComBindMode)},
                      showRegister=${hasTid and allowRegister == true},
                      methodCount=${(passwordEnabled ? 1 : 0) + (hasDingTalk ? 1 : 0) + (hasWeCom ? 1 : 0)},
                      selectedMethod=${loginMethod != null and !#strings.isEmpty(loginMethod)} ? ${loginMethod} : ''">
            <h2 class="title">登录</h2>
            <p class="login-panel-lead" th:if="${passwordEnabled and (hasDingTalk or hasWeCom)}">选择一种方式完成身份认证</p>
            <p class="login-panel-lead" th:if="${passwordEnabled and !hasDingTalk and !hasWeCom}">请输入账号密码登录</p>
            <p class="login-panel-lead" th:if="${!passwordEnabled and (hasDingTalk or hasWeCom)}">使用企业扫码完成身份认证</p>

            <div class="error-message login-error" th:if="${error != null and error != ''}" th:text="${error}" role="alert"></div>

            <input type="hidden" id="tid" name="tid" th:value="${tid} ?: ''">

            <div class="login-method-cards" role="tablist" aria-label="登录方式"
                 th:if="${methodCount > 1}">
                <button type="button" class="login-method-card" role="tab"
                        data-login-method="password"
                        th:if="${passwordEnabled}"
                        th:classappend="${selectedMethod == 'password'} ? ' login-method-card-active' : ''"
                        th:attr="aria-selected=${selectedMethod == 'password'} ? 'true' : 'false',
                                 aria-controls='login-workspace-password',
                                 tabindex=${selectedMethod == 'password'} ? '0' : '-1'">
                    <span class="login-method-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                            <rect x="5" y="11" width="14" height="10" rx="2"/>
                            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
                        </svg>
                    </span>
                    <span class="login-method-name">账号密码</span>
                    <span class="login-method-hint">用户名登录</span>
                </button>
                <button type="button" class="login-method-card" role="tab"
                        data-login-method="dingtalk"
                        th:if="${hasDingTalk}"
                        th:classappend="${selectedMethod == 'dingtalk'} ? ' login-method-card-active' : ''"
                        th:attr="aria-selected=${selectedMethod == 'dingtalk'} ? 'true' : 'false',
                                 aria-controls='login-workspace-dingtalk',
                                 tabindex=${selectedMethod == 'dingtalk'} ? '0' : '-1'">
                    <span class="login-method-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M4 10c2-4 14-4 16 0"/>
                            <circle cx="8" cy="11" r="1.2" fill="currentColor" stroke="none"/>
                            <circle cx="16" cy="11" r="1.2" fill="currentColor" stroke="none"/>
                            <path d="M7 15c1.5 2 8.5 2 10 0"/>
                        </svg>
                    </span>
                    <span class="login-method-name">钉钉</span>
                    <span class="login-method-hint">扫码或跳转</span>
                </button>
                <button type="button" class="login-method-card" role="tab"
                        data-login-method="wecom"
                        th:if="${hasWeCom}"
                        th:classappend="${selectedMethod == 'wecom'} ? ' login-method-card-active' : ''"
                        th:attr="aria-selected=${selectedMethod == 'wecom'} ? 'true' : 'false',
                                 aria-controls='login-workspace-wecom',
                                 tabindex=${selectedMethod == 'wecom'} ? '0' : '-1'">
                    <span class="login-method-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M5 12a7 7 0 1 1 8.5 6.8L8 20l.6-3.2A7 7 0 0 1 5 12Z"/>
                            <circle cx="9" cy="12" r="0.9" fill="currentColor" stroke="none"/>
                            <circle cx="13" cy="12" r="0.9" fill="currentColor" stroke="none"/>
                        </svg>
                    </span>
                    <span class="login-method-name">企业微信</span>
                    <span class="login-method-hint">跳转扫码</span>
                </button>
            </div>

            <div class="login-workspace">
                <div id="login-workspace-password"
                     class="login-workspace-panel"
                     role="tabpanel"
                     th:if="${passwordEnabled}"
                     th:hidden="${selectedMethod != 'password'}">
                    <form method="POST" action="/auth/login">
                        <div class="form-group">
                            <label for="username">用户名<span class="required-asterisk" aria-hidden="true">*</span></label>
                            <input type="text" id="username" name="username" th:value="${username} ?: ''" required>
                        </div>

                        <div class="form-group">
                            <label for="password">密码<span class="required-asterisk" aria-hidden="true">*</span></label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <input type="hidden" name="tid" th:value="${tid} ?: ''">

                        <div class="form-actions landing-form-actions">
                            <button type="submit" class="btn btn-primary btn-lg">登录</button>
                            <a th:if="${showRegister}"
                               th:href="@{/auth/register.html(tid=${tid})}"
                               class="btn btn-outline btn-lg">注册账号</a>
                        </div>
                    </form>
                </div>

                <div id="login-workspace-dingtalk"
                     class="login-workspace-panel"
                     role="tabpanel"
                     th:if="${hasDingTalk}"
                     th:hidden="${selectedMethod != 'dingtalk'}">
                    <div class="dingtalk-login-wrap"
                         th:attr="data-dingtalk-qr-init=1,
                                  data-bootstrap-url=@{/auth/dingtalk/qr/bootstrap},
                                  data-bind-mode=${dingTalkBindMode},
                                  data-qr-container-id=dingtalk-qr-container">
                        <p class="dingtalk-qr-hint">打开钉钉 App 扫描下方二维码</p>
                        <div id="dingtalk-qr-container" class="dingtalk-qr-box" aria-label="钉钉扫码登录"></div>
                        <p class="dingtalk-qr-status" id="dingtalk-qr-status" aria-live="polite">切换到本方式后将加载钉钉扫码</p>
                        <a class="btn btn-outline btn-lg btn-block"
                           th:href="@{/auth/dingtalk/authorize(bindMode=${dingTalkBindMode},tid=${tid})}">浏览器跳转钉钉登录</a>
                        <p class="dingtalk-fallback-note">无法扫码时可使用浏览器跳转方式</p>
                    </div>
                </div>

                <div id="login-workspace-wecom"
                     class="login-workspace-panel"
                     role="tabpanel"
                     th:if="${hasWeCom}"
                     th:hidden="${selectedMethod != 'wecom'}">
                    <div class="wecom-login-wrap">
                        <p class="wecom-login-hint">将跳转到企业微信完成扫码登录</p>
                        <a class="btn btn-primary btn-lg btn-block"
                           th:href="@{/auth/wecom/authorize(bindMode=${weComBindMode},tid=${tid})}">
                            前往企业微信扫码
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="landing-footer" th:text="${brandName}">
        G2Rain IAM
    </footer>
</main>
<script>
/*<![CDATA[*/
(function () {
    var wrap = document.querySelector('[data-dingtalk-qr-init]');
    var ddLoginSrc = 'https://g.alicdn.com/dingding/dinglogin/0.0.5/ddLogin.js';
    var statusEl = document.getElementById('dingtalk-qr-status');

    function setStatus(t, loading) {
        if (!statusEl) { return; }
        statusEl.textContent = t;
        statusEl.classList.toggle('is-loading', !!loading);
    }

    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.onload = function () { resolve(); };
            s.onerror = function () { reject(new Error('ddLogin script load failed')); };
            document.head.appendChild(s);
        });
    }

    function extractLoginTmpCode(data) {
        if (data == null) { return null; }
        if (typeof data === 'string') { return data; }
        if (typeof data === 'object') {
            if (data.loginTmpCode) { return String(data.loginTmpCode); }
            if (data.tmpCode) { return String(data.tmpCode); }
        }
        return null;
    }

    function runQrBootstrap() {
        if (!wrap) { return; }
        var bootstrapUrl = wrap.getAttribute('data-bootstrap-url');
        var bindMode = wrap.getAttribute('data-bind-mode') || '';
        var qrId = wrap.getAttribute('data-qr-container-id') || 'dingtalk-qr-container';
        var tidEl = document.getElementById('tid');
        var body = {
            bindMode: bindMode,
            tid: tidEl ? (tidEl.value || '') : ''
        };
        return fetch(bootstrapUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (json) {
            if (!json || !json.data || !json.data.gotoUrl) {
                setStatus('无法准备钉钉扫码，请使用「浏览器跳转钉钉登录」。', false);
                return;
            }
            var gotoPlain = json.data.gotoUrl;
            if (typeof window.DDLogin !== 'function') {
                setStatus('钉钉扫码组件未就绪，请使用「浏览器跳转钉钉登录」。', false);
                return;
            }
            function onMsg(ev) {
                if (ev.origin !== 'https://login.dingtalk.com') { return; }
                var code = extractLoginTmpCode(ev.data);
                if (!code) { return; }
                window.removeEventListener('message', onMsg, false);
                try {
                    var u = new URL(gotoPlain);
                    u.searchParams.set('loginTmpCode', code);
                    window.location.assign(u.toString());
                } catch (e) {
                    setStatus('扫码成功，但跳转失败，请使用「浏览器跳转钉钉登录」。', false);
                }
            }
            window.addEventListener('message', onMsg, false);
            window.DDLogin({
                id: qrId,
                goto: encodeURIComponent(gotoPlain),
                style: 'border:none;background-color:#FFFFFF;border-radius:8px;',
                width: '300',
                height: '300'
            });
            setStatus('请使用钉钉扫描上方二维码', false);
        });
    }

    function initDingTalkQr() {
        if (!wrap || window.__g2rainDingTalkQrStarted) { return; }
        window.__g2rainDingTalkQrStarted = true;
        setStatus('正在加载钉钉扫码…', true);
        loadScript(ddLoginSrc).then(runQrBootstrap).catch(function () {
            setStatus('加载钉钉扫码失败，请使用「浏览器跳转钉钉登录」。', false);
        });
    }

    function selectMethod(name) {
        document.querySelectorAll('[data-login-method]').forEach(function (card) {
            var on = card.getAttribute('data-login-method') === name;
            card.classList.toggle('login-method-card-active', on);
            card.setAttribute('aria-selected', on ? 'true' : 'false');
            card.tabIndex = on ? 0 : -1;
        });
        document.querySelectorAll('.login-workspace-panel').forEach(function (panel) {
            var match = panel.id === 'login-workspace-' + name;
            if (match) {
                panel.removeAttribute('hidden');
            } else {
                panel.setAttribute('hidden', '');
            }
        });
        if (name === 'dingtalk') {
            initDingTalkQr();
        }
    }

    document.querySelectorAll('[data-login-method]').forEach(function (card) {
        card.addEventListener('click', function () {
            selectMethod(card.getAttribute('data-login-method'));
        });
    });

    var dingtalkPanel = document.getElementById('login-workspace-dingtalk');
    if (dingtalkPanel && !dingtalkPanel.hasAttribute('hidden')) {
        initDingTalkQr();
    }
})();
/*]]>*/
</script>
</body>
</html>
