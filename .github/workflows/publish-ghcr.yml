name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/g2rain/g2rain-iam
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout v5.0.0
      - name: Check out the tagged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      # actions/setup-java v5.0.0
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Configure GitHub Maven dependency repositories
        shell: bash
        run: |
          set -euo pipefail
          settings_path="${RUNNER_TEMP}/g2rain-maven-settings.xml"
          python3 - "$settings_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.Element('settings', xmlns='http://maven.apache.org/SETTINGS/1.0.0')
          servers = ET.SubElement(root, 'servers')
          profile = ET.SubElement(ET.SubElement(root, 'profiles'), 'profile')
          ET.SubElement(profile, 'id').text = 'g2rain-packages'
          repositories = ET.SubElement(profile, 'repositories')
          for name in ('g2rain-basis', 'g2rain-member'):
              server = ET.SubElement(servers, 'server')
              ET.SubElement(server, 'id').text = name
              ET.SubElement(server, 'username').text = '${env.GITHUB_ACTOR}'
              ET.SubElement(server, 'password').text = '${env.GITHUB_TOKEN}'
              repository = ET.SubElement(repositories, 'repository')
              ET.SubElement(repository, 'id').text = name
              ET.SubElement(repository, 'url').text = 'https://maven.pkg.github.com/g2rain/' + name
              ET.SubElement(ET.SubElement(repository, 'releases'), 'enabled').text = 'true'
              ET.SubElement(ET.SubElement(repository, 'snapshots'), 'enabled').text = 'false'
          ET.SubElement(ET.SubElement(root, 'activeProfiles'), 'activeProfile').text = 'g2rain-packages'
          ET.ElementTree(root).write(sys.argv[1], encoding='utf-8', xml_declaration=True)
          PY
          chmod 600 "$settings_path"
          echo "MAVEN_SETTINGS=$settings_path" >> "$GITHUB_ENV"
          echo 'Configured g2rain-basis and g2rain-member Maven repositories.'

      - name: Verify release tag, branch membership, release notes, and version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable vX.Y.Z tags may publish; got ${tag}." >&2
            exit 1
          }
          release_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${release_commit}" origin/main || {
            echo "${release_commit} is not contained in origin/main; publish tags must be created after merge to main." >&2
            exit 1
          }
          release_note="docs/releases/${tag}.md"
          git cat-file -e "${release_commit}:${release_note}" || {
            echo "Missing ${release_note} at the tagged commit." >&2
            exit 1
          }
          test -n "$(git show "${release_commit}:${release_note}" | tr -d '[:space:]')" || {
            echo "${release_note} is empty." >&2
            exit 1
          }
          version="$(mvn --settings "$MAVEN_SETTINGS" --batch-mode --quiet -Dstyle.color=never -DforceStdout help:evaluate -Dexpression=project.version)"
          test "v${version}" = "${tag}" || {
            echo "Tag ${tag} does not match Maven project version ${version}." >&2
            exit 1
          }
          echo "RELEASE_COMMIT=${release_commit}" >> "${GITHUB_ENV}"

      - name: Build and test
        run: mvn --settings "$MAVEN_SETTINGS" -B --no-transfer-progress -U clean install

      # docker/login-action v3.4.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both immutable tags with Jib
        shell: bash
        run: |
          set -euo pipefail
          mvn --settings "$MAVEN_SETTINGS" -B --no-transfer-progress -DskipTests=true compile jib:build \
            -Djib.to.image="${IMAGE}:${GITHUB_REF_NAME#v}" \
            -Djib.to.tags="sha-${RELEASE_COMMIT}"

      - name: Report completed publication
        if: success()
        shell: bash
        run: |
          {
            echo '## GHCR publication complete'
            echo
            echo "- \`${IMAGE}:${GITHUB_REF_NAME#v}\`"
            echo "- \`${IMAGE}:sha-${RELEASE_COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
