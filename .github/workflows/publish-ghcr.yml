name: Publish GHCR image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/g2rain/g2rain-iam
    steps:
      # actions/checkout v5.0.0
      - name: Check out the tagged commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      # actions/setup-java v5.0.0
      - name: Set up Temurin JDK 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release tag, branch membership, release notes, and version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable vX.Y.Z tags may publish; got ${tag}." >&2
            exit 1
          }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "${GITHUB_SHA} is not contained in origin/main; publish tags must be created after merge to main." >&2
            exit 1
          }
          release_note="docs/releases/${tag}.md"
          git cat-file -e "${GITHUB_SHA}:${release_note}" || {
            echo "Missing ${release_note} at the tagged commit." >&2
            exit 1
          }
          test -n "$(git show "${GITHUB_SHA}:${release_note}" | tr -d '[:space:]')" || {
            echo "${release_note} is empty." >&2
            exit 1
          }
          version="$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          version="$(printf '%s' "${version}" | tail -n 1)"
          test "v${version}" = "${tag}" || {
            echo "Tag ${tag} does not match Maven project version ${version}." >&2
            exit 1
          }

      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      # docker/login-action v3.4.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push both immutable tags with Jib
        shell: bash
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress jib:build \
            -Djib.to.image="${IMAGE}" \
            -Djib.to.tags="${GITHUB_REF_NAME},sha-${GITHUB_SHA}"

      - name: Report completed publication
        if: success()
        shell: bash
        run: |
          {
            echo '## GHCR publication complete'
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Tags: \`${GITHUB_REF_NAME}\`, \`sha-${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
